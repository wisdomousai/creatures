<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Little toy robots of animals, animated live in three.js: pick one and it jumps out to play."
    />
    <title>Creatures</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip" href="#sheet">Skip to the creatures</a>
    <div class="frame" aria-hidden="true"></div>
    <button class="card opener" type="button" aria-controls="sheet" aria-expanded="false">
      <i class="pin"></i>
      <span class="card-faces"></span>
      <span class="card-name">Play</span>
      <span class="card-line">Pick one and it jumps out to play.</span>
    </button>
    <div class="scrim" aria-hidden="true"></div>
    <main id="sheet">
      <header class="head">
        <h1>Play</h1>
        <p class="lede">Everyone in the box. Pick one and it jumps out to play.</p>
      </header>
      <div class="search" role="search">
        <label class="search-box">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" />
            <path d="M12.6 12.6 17 17" />
          </svg>
          <input
            id="find"
            type="search"
            placeholder="Search the creatures"
            aria-label="Search the creatures"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="go"
          />
          <output class="found" for="find"></output>
        </label>
        <button class="clear" type="button" aria-label="Clear the search" hidden>
          <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
            <path d="M5 5l10 10M15 5 5 15" />
          </svg>
        </button>
      </div>
      <div class="ways">
        <nav class="places" aria-label="Playgrounds and the room"></nav>
        <div class="controls">
          <button class="send" type="button">Send everyone out</button>
        </div>
        <p class="hint">
          Right-click one (or press it a while) for its tricks. Hold one down and it follows you.
        </p>
      </div>
      <div id="page"></div>
      <footer class="foot">
        <p class="agents">Want to make one? Your coding agent can learn how: </p>
        <a href="https://github.com/wisdomousai/creatures">@wisdomousai/creatures</a> · MIT
      </footer>
    </main>
    <button class="shut" type="button">Close</button>
    <canvas id="crew" aria-hidden="true"></canvas>
    <div id="hits"></div>
    <button
      class="settings-key"
      type="button"
      aria-controls="settings"
      aria-expanded="false"
      aria-label="Settings"
      title="Settings"
    >
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <path d="M3 6.5h14M3 13.5h14" />
        <circle cx="7.5" cy="6.5" r="2.2" />
        <circle cx="12.5" cy="13.5" r="2.2" />
      </svg>
    </button>
    <div class="settings" id="settings" role="group" aria-label="Settings" hidden>
      <div class="choice" role="group" aria-label="Look" data-choice="look"></div>
      <div class="choice" role="group" aria-label="Lights" data-choice="lights"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

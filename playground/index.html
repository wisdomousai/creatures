<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Little toy robots of animals, animated live in three.js: pick one and it jumps out to play."
    />
    <title>Creatures</title>
  </head>
  <body>
    <a class="skip" href="#sheet">Skip to the creatures</a>
    <div class="frame" aria-hidden="true"></div>
    <main id="sheet">
      <header class="head">
        <h1>Creatures</h1>
        <p class="lede">Everyone in the box. Pick one and it jumps out to play.</p>
        <nav class="places" aria-label="Playgrounds and the room"></nav>
        <div class="controls">
          <div class="choice" role="group" aria-label="Look" data-choice="look"></div>
          <div class="choice" role="group" aria-label="Lights" data-choice="lights"></div>
          <button class="send" type="button">Send everyone out</button>
        </div>
        <p class="hint">
          Right-click one (or press it a while) for its tricks. Hold one down and it follows you.
        </p>
      </header>
      <div id="page"></div>
      <footer class="foot">
        <a href="https://github.com/wisdomousai/creatures">@wisdomousai/creatures</a> · MIT
      </footer>
    </main>
    <canvas id="crew" aria-hidden="true"></canvas>
    <div id="hits"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
